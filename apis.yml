aid: easol
name: Easol
description: >-
  Easol is an experience commerce platform for creators of festivals, adventure and travel
  operators, entertainment venues, and multi-day events. Its all-in-one system combines a
  branded website builder, booking and ticketing, packages and upsells, global payments and
  on-site POS, marketing and CRM, operations analytics, AI support agents, and creator
  capital/funding, letting experience businesses move beyond rigid legacy ticketing systems
  and sell and scale on their own platform. Plans range from Easol Stride (from $250/month)
  to a custom-priced Easol Pro tier. Easol does not currently publish a public developer API,
  OpenAPI specification, or developer portal; this profile captures its public commercial,
  support, security, and status surfaces, and is backed by Tiger Global.
